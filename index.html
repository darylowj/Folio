<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6E5B">
<meta name="description" content="A private PDF editor that runs on your device.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Folio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Folio PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Caveat:wght@700&family=Dancing+Script:wght@700&display=swap">
<style>
/* Layout: app shell. Top bar, then a work row: tool dock, page strip, and a scrolling desk of white paper. On phones the dock moves to the bottom and the page strip becomes a drawer. */
:root{
  --desk:#E3E7E5; --surface:#FBFCFB; --surface-2:#EEF2F0; --line:#D2D9D6; --fg:#17201E; --muted:#5A6764;
  --accent:#0B6E5B; --accent-fg:#FFFFFF; --accent-soft:#D3EDE5; --danger:#B3261E; --hit:#FF9F1C; --shadow:rgba(20,35,30,.16);
  --font:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#111615; --surface:#1A201F; --surface-2:#222A28; --line:#2E3836; --fg:#E2E8E6; --muted:#94A19E;
  --accent:#43C4A5; --accent-fg:#05241C; --accent-soft:#16392F; --danger:#FF8A80; --hit:#FFB347; --shadow:rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#111615; --surface:#1A201F; --surface-2:#222A28; --line:#2E3836; --fg:#E2E8E6; --muted:#94A19E;
  --accent:#43C4A5; --accent-fg:#05241C; --accent-soft:#16392F; --danger:#FF8A80; --hit:#FFB347; --shadow:rgba(0,0,0,.5); color-scheme:dark }
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--desk);color:var(--fg);font-family:var(--font);font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:8px;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.brand b{font-weight:600;letter-spacing:.01em;font-size:15px}
.brand .fname{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.grp{display:flex;align-items:center;gap:2px}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:8px;border:1px solid transparent;background:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.35;cursor:default;background:none}
.btn.ghost{border-color:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-fg);font-weight:500}
.btn.primary:hover{filter:brightness(1.07)}
.btn.icon{padding:0;width:36px;justify-content:center}
.btn.danger{color:var(--danger)}
.zoom{font-family:var(--mono);font-size:12px;min-width:44px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}

.props{display:flex;align-items:center;gap:8px;min-height:44px;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto;scrollbar-width:none}
.props .hint{color:var(--muted);white-space:nowrap}
.props .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:2px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);flex:none;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.chip{height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.search{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.search input{flex:1;min-width:80px;max-width:340px;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface-2)}
.search .count{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

.work{display:grid;grid-template-columns:64px 176px minmax(0,1fr);min-height:0;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.work.nopanel{grid-template-columns:64px 0 minmax(0,1fr)}
.dock{display:flex;flex-direction:column;gap:2px;padding:10px 6px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:10px;border:0;background:none;color:var(--muted);font-size:10.5px;letter-spacing:.02em}
.tool:hover{background:var(--surface-2);color:var(--fg)}
.tool.on{background:var(--accent-soft);color:var(--accent)}
.tool.on svg{stroke-width:2}

.panel{background:var(--surface-2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.work.nopanel .panel{visibility:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 10px 6px}
.panel-h .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.selbar{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px 8px}
.selbar .chip{height:28px;font-size:12px;padding:0 8px}
.thumbs{flex:1;overflow-y:auto;padding:4px 10px 24px;display:flex;flex-direction:column;gap:14px}
.th{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:8px;padding:6px;cursor:pointer}
.th:hover{background:var(--surface)}
.th.cur{background:var(--surface);box-shadow:inset 0 0 0 2px var(--accent)}
.th.drop-before::before{content:"";position:absolute;left:6px;right:6px;top:-8px;height:3px;border-radius:2px;background:var(--accent)}
.th canvas{background:#fff;box-shadow:0 1px 3px var(--shadow);max-width:100%;display:block}
.th .num{font-family:var(--mono);font-size:11px;color:var(--muted)}
.th .ck{position:absolute;top:10px;left:10px;width:20px;height:20px;border-radius:5px;border:1.5px solid var(--muted);background:var(--surface);display:grid;place-items:center;padding:0}
.th .ck.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.th .ck svg{width:14px;height:14px;stroke-width:2.5}
.th .acts{display:flex;gap:0;opacity:0;transition:opacity .12s}
.th:hover .acts,.th:focus-within .acts,.th.cur .acts{opacity:1}
.th .acts .btn{width:28px;height:28px}
.th .acts svg{width:16px;height:16px}

.viewer{position:relative;overflow:auto;min-width:0;overscroll-behavior:contain}
.pages{display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px 16px 120px;width:max-content;min-width:100%}
.pv{position:relative;background:#fff;box-shadow:0 1px 2px var(--shadow),0 6px 24px var(--shadow);flex:none;user-select:none;-webkit-user-select:none}
.pv>canvas,.pv>svg,.pv>.fl,.pv>.ol{position:absolute;inset:0;width:100%;height:100%}
.pv .pc{background:#fff}
.pv .wmc{pointer-events:none}
.pv svg.mk{pointer-events:none;overflow:visible}
.pv .pnum{position:absolute;left:0;bottom:-18px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.app[data-tool="select"] .pv svg.mk .hitable{pointer-events:visiblePainted;cursor:move}
.app:not([data-tool="select"]) .pv{touch-action:none;cursor:crosshair}
.app[data-tool="text"] .pv{cursor:text}
.app[data-tool="wmmove"] .pv{cursor:move}
.app[data-tool="edit"] .pv{cursor:text}
.app:not([data-tool="select"]) .fl{pointer-events:none}
.ol{pointer-events:none}
.obj{position:absolute;transform-origin:0 0;pointer-events:auto}
.app:not([data-tool="select"]) .obj:not(.editing){pointer-events:none}
.app[data-tool="select"] .obj{cursor:move}
.obj.sel{outline:1.5px dashed var(--accent);outline-offset:3px}
.obj.text{white-space:pre;font-family:Helvetica,Arial,sans-serif;line-height:1.2;min-width:8px;min-height:1em}
.obj.text.editing{outline:1.5px solid var(--accent);cursor:text;user-select:text;-webkit-user-select:text;background:rgba(255,255,255,.7)}
.obj.text.editing:empty::before{content:"Type here";color:#9AA}
.obj.img img{width:100%;height:100%;display:block;pointer-events:none}
.obj .rz{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid #fff;cursor:nwse-resize;touch-action:none}
.obj.note{width:26px;height:26px}
.obj.note .ico{width:26px;height:26px;border-radius:6px 6px 6px 1px;background:#FFD23F;border:1px solid #B8901A;display:grid;place-items:center;color:#5A4500}
.obj.note .ico svg{width:15px;height:15px}
.obj.note .bub{position:absolute;top:32px;left:0;width:220px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px var(--shadow);padding:8px;cursor:default}
.obj.note textarea{width:100%;height:84px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--surface-2)}
.fl{pointer-events:none}
.fld{position:absolute;pointer-events:auto;border:0;border-bottom:1.5px solid rgba(11,110,91,.55);background:rgba(11,110,91,.07);color:#111;padding:0 4px;border-radius:2px;font-family:Helvetica,Arial,sans-serif}
.fld:focus{outline:2px solid #0B6E5B;background:rgba(11,110,91,.12)}
textarea.fld{resize:none;padding:2px 4px;line-height:1.25}
button.fld{display:grid;place-items:center;padding:0;border:1.5px solid rgba(11,110,91,.6);font-weight:700;color:#0B6E5B}
button.fld.radio{border-radius:50%}
select.fld{color-scheme:light}

.empty{display:grid;place-items:center;min-height:100%;padding:24px 16px}
.empty .card{max-width:420px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{margin:0;font-size:20px;font-weight:600;text-wrap:balance}
.empty p{margin:0;color:var(--muted)}
.dropping .viewer::after{content:"Drop to add";position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:12px;display:grid;place-items:center;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--desk) 80%,transparent);pointer-events:none}

.menu{position:absolute;right:0;top:42px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px var(--shadow);padding:6px;min-width:230px;z-index:30;display:flex;flex-direction:column}
.menu button{text-align:left;padding:9px 10px;border-radius:6px;border:0;background:none;display:flex;flex-direction:column;gap:1px}
.menu button:hover{background:var(--surface-2)}
.menu small{color:var(--muted);font-size:12px}

.scrim{position:fixed;inset:0;background:rgba(10,18,16,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;display:flex;flex-direction:column}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.modal h3{margin:0;font-size:16px;font-weight:600}
.modal .body{padding:6px 16px 12px;display:flex;flex-direction:column;gap:12px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px 16px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:12px;color:var(--muted);font-weight:500}
.field input[type=text],.field textarea,.field select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface-2);width:100%}
.field textarea{resize:vertical;min-height:58px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>.field{flex:1;min-width:120px}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:9px;align-self:flex-start}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:7px}
.tabs button.on{background:var(--surface);box-shadow:0 1px 2px var(--shadow);font-weight:500}
.sigpad{width:100%;height:170px;border:1px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;display:block}
.sigtype{width:100%;height:110px;border:1px dashed var(--line);border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;color:#111;font-size:44px;white-space:nowrap}
.saved{display:flex;gap:8px;flex-wrap:wrap}
.saved button{height:54px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;position:relative}
.saved img{height:100%;display:block}
.check{display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
.check small{display:block;color:var(--muted)}
.note-s{color:var(--muted);font-size:12.5px;line-height:1.45}
input[type=range]{accent-color:var(--accent);width:100%}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:80;max-width:calc(100% - 32px);box-shadow:0 8px 24px var(--shadow)}
.busy{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,18,16,.3);z-index:70}
.busy div{background:var(--surface);padding:14px 20px;border-radius:10px;box-shadow:0 8px 24px var(--shadow);display:flex;gap:10px;align-items:center}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}

.only-m{display:none}
@media (max-width:760px){
  .hide-m{display:none!important}
  .only-m{display:inline-flex}
  .app{grid-template-rows:auto auto minmax(0,1fr) auto}
  .work,.work.nopanel{grid-template-columns:minmax(0,1fr);position:relative;padding:0}
  .dock{grid-row:4;flex-direction:row;overflow-x:auto;border-right:0;border-top:1px solid var(--line);padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:none;justify-content:space-between}
  .tool{min-width:52px}
  .panel{position:absolute;left:0;top:0;bottom:0;width:min(220px,70vw);z-index:20;box-shadow:8px 0 30px var(--shadow);padding-left:env(safe-area-inset-left,0px)}
  .work.nopanel .panel{display:none}
  .th .acts{opacity:1}
  .pages{padding:16px 12px 80px}
}
</style>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
body{margin:0;font-size:14px}
img{max-width:100%}
</style>
</head>
<body>

<div class="app" id="app" data-tool="select">
  <div class="top">
    <button class="btn icon" id="bPanel" title="Pages" aria-label="Show or hide pages"></button>
    <div class="brand"><b>Folio</b><span class="fname" id="fname"></span></div>
    <div class="grp">
      <button class="btn" id="bOpen" title="Open a PDF or photo"><span class="hide-m">Open</span></button>
      <button class="btn hide-m" id="bAdd" title="Add files to the end (merge)">Add files</button>
    </div>
    <span class="sep hide-m"></span>
    <div class="grp">
      <button class="btn icon" id="bUndo" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
      <button class="btn icon hide-m" id="bRedo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"></button>
      <button class="btn icon" id="bFind" title="Search" aria-label="Search"></button>
    </div>
    <div class="grp hide-m">
      <button class="btn icon" id="bZout" aria-label="Zoom out"></button>
      <button class="btn zoom" id="bFit" title="Fit to width">100%</button>
      <button class="btn icon" id="bZin" aria-label="Zoom in"></button>
    </div>
    <div style="position:relative">
      <button class="btn primary" id="bSave"><span>Save</span></button>
      <div class="menu" id="saveMenu" hidden>
        <button id="mPdf">Save as PDF<small>All pages with your changes</small></button>
        <button id="mJpg">Save this page as JPG<small>Handy for sending an IC copy</small></button>
        <button id="mAdd" class="only-m">Add files<small>Merge more PDFs or photos</small></button>
      </div>
    </div>
  </div>
  <div class="props" id="props"></div>
  <div class="work" id="work">
    <nav class="dock" id="dock" aria-label="Tools"></nav>
    <aside class="panel" id="panel">
      <div class="panel-h"><span class="lbl" id="pcount">Pages</span><button class="chip" id="bSplit" style="height:26px;font-size:12px">Split…</button></div>
      <div class="selbar" id="selbar"></div>
      <div class="thumbs" id="thumbs"></div>
    </aside>
    <main class="viewer" id="viewer"><div class="pages" id="pages"></div></main>
  </div>
</div>
<input type="file" id="fOpen" accept="application/pdf,.pdf,image/*" multiple hidden>
<input type="file" id="fAdd" accept="application/pdf,.pdf,image/*" multiple hidden>
<input type="file" id="fImg" accept="image/*" hidden>

<script>window.FOLIO_SITE = true;</script>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/jszip.min.js"></script>

/* ---------- state ---------- */
const S = {
  sources: [], pages: [], annots: {}, form: {}, wm: null, imgs: {},
  name: 'sample-form', isSample: true,
  tool: 'select', hlColor: '#FFE14D', inkColor: '#1D3A8A', textColor: '#111111', inkWidth: 2, fontSize: 14,
  ocr: {},
  scale: 1, fit: true, sel: null, editing: null, pending: null, cur: 0, pageSel: new Set(),

let undoStack = [], redoStack = [];
const snap = () => JSON.stringify({ pages: S.pages, annots: S.annots, form: S.form, wm: S.wm });
function pushUndo(s = snap()) { undoStack.push(s); if (undoStack.length > 150) undoStack.shift(); redoStack = []; syncUndo(); }
function commit(fn) { pushUndo(); fn(); }
function restore(s) {

  S.sel = null; S.editing = null; rebuild(); syncUndo();
}
function undo() { if (!undoStack.length) return; redoStack.push(snap()); restore(undoStack.pop()); }
function redo() { if (!redoStack.length) return; undoStack.push(snap()); restore(redoStack.pop()); }

const pageById = id => S.pages.find(p => p.id === id);

function findObj(sel) { if (!sel) return null; return (S.annots[sel.pageId] || []).find(o => o.id === sel.id) || null; }

/* ---------- loading ---------- */
async function loadSource(bytes, name) {
  const si = S.sources.length;
  const src = { name, bytes, pdf: null, pageObjs: [], fields: [] };
  src.pdf = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
  for (let i = 1; i <= src.pdf.numPages; i++) src.pageObjs.push(await src.pdf.getPage(i));
  S.sources.push(src);
  try { await scanFields(si); } catch (e) { console.warn('form scan', e); }
  return si;
}

async function scanFields(si) {
  const src = S.sources[si];
  const doc = await PDFDocument.load(src.bytes, { ignoreEncryption: true, updateMetadata: false });
  const fields = doc.getForm().getFields();
  if (!fields.length) return;
  const pages = doc.getPages();
  const refIdx = new Map(pages.map((p, i) => [p.ref, i]));
  const findPage = w => {
    const P = w.P(); if (P && refIdx.has(P)) return refIdx.get(P);
    for (let i = 0; i < pages.length; i++) {
      const an = pages[i].node.Annots(); if (!an) continue;
      for (const r of an.asArray()) if (doc.context.lookup(r) === w.dict) return i;
    }
    return -1;
  };
  for (const f of fields) {
    let kind = null, value = null, options = null, multiline = false;
    if (f instanceof PDFLib.PDFTextField) { kind = 'text'; value = f.getText() || ''; multiline = f.isMultiline(); }
    else if (f instanceof PDFLib.PDFCheckBox) { kind = 'check'; value = f.isChecked(); }
    else if (f instanceof PDFLib.PDFRadioGroup) { kind = 'radio'; value = f.getSelected() || ''; options = f.getOptions(); }
    else if (f instanceof PDFLib.PDFDropdown || f instanceof PDFLib.PDFOptionList) { kind = 'select'; value = (f.getSelected() || [])[0] || ''; options = f.getOptions(); }
    if (!kind || f.isReadOnly()) continue;
    const widgets = f.acroField.getWidgets().map((w, i) => {
      const r = w.getRectangle();
      let on = null;
      if (kind === 'radio') { on = options && options.length === f.acroField.getWidgets().length ? options[i] : null; }
      return { page: findPage(w), rect: [r.x, r.y, r.width, r.height], on };
    }).filter(w => w.page >= 0);
    const key = si + '|' + f.getName();
    src.fields.push({ key, name: f.getName(), kind, options, multiline, widgets });
    if (!(key in S.form)) S.form[key] = value;
  }
}

async function imageToPdf(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
    const doc = await PDFDocument.create();
    const im = await doc.embedJpg(new Uint8Array(await blob.arrayBuffer()));
    const k = 842 / Math.max(im.width, im.height);
    const W = im.width * k, H = im.height * k;
    doc.addPage([W, H]).drawImage(im, { x: 0, y: 0, width: W, height: H });
    return new Uint8Array(await doc.save());
  } finally { URL.revokeObjectURL(url); }
}

async function openFiles(files, append) {
  files = [...files]; if (!files.length) return;
  const before = snap();
  busy(true, 'Opening…');
  let added = 0;
  try {
    if (!append || S.isSample) {
      S.sources = []; S.pages = []; S.annots = {}; S.form = {}; S.wm = null; S.ocr = {}; S.pageSel.clear();
      tcCache.clear(); linesCache.clear(); hits = []; hitIdx = -1;
      undoStack = []; redoStack = []; S.isSample = false; S.name = baseName(files[0].name); append = false;
    }
    for (const f of files) {
      let bytes;
      try {
        if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) bytes = new Uint8Array(await f.arrayBuffer());
        else if (f.type.startsWith('image/') || /\.(jpe?g|png|webp|gif|heic|heif|bmp)$/i.test(f.name)) bytes = await imageToPdf(f);
        else { toast(`${f.name} isn't a PDF or an image.`); continue; }
        const si = await loadSource(bytes, f.name);
        S.sources[si].pageObjs.forEach((_, i) => S.pages.push({ id: uid(), src: si, idx: i, rot: 0 }));
        added++;
      } catch (e) {
        console.error(e);
        toast(e?.name === 'PasswordException' ? `${f.name} is password protected. Remove the password first, then open it again.` : `Couldn't open ${f.name}. The file may be damaged.`);
      }
    }
  } finally { busy(false); }
  if (append && added) { pushUndo(before); toast(`Added ${added} file${added > 1 ? 's' : ''} to the end.`); }
  S.sel = null; S.fit = true; rebuild();
}

/* ---------- page views ---------- */
const viewer = $('#viewer'), pagesEl = $('#pages'), thumbsEl = $('#thumbs');
const io = new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting) renderCanvas(e.target); }, { root: viewer, rootMargin: '800px 0px' });
const tio = new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting) renderThumb(e.target); }, { root: thumbsEl, rootMargin: '400px 0px' });

function fitScale() {
  if (!S.pages.length) return 1;
  const avail = viewer.clientWidth - (innerWidth <= 760 ? 24 : 48);
  const maxW = Math.max(...S.pages.map(p => vp(p, 1).width));
  return Math.max(0.25, Math.min(innerWidth <= 760 ? 3 : 1.5, avail / maxW));
}

function rebuild() {
  const ratio = viewer.scrollHeight ? viewer.scrollTop / viewer.scrollHeight : 0;
  if (S.fit) S.scale = fitScale();
  io.disconnect();
  pagesEl.textContent = '';
  if (!S.pages.length) {
    pagesEl.append(h('div', { class: 'empty' }, h('div', { class: 'card' },
      h('h2', {}, 'Open a PDF or a photo'),
      h('p', {}, 'Files stay on this device. Nothing is uploaded.'),
      h('button', { class: 'btn primary', onclick: () => $('#fOpen').click() }, 'Choose file'))));
  }
  S.pages.forEach((p, i) => {
    const v = vp(p);
    const pv = h('div', { class: 'pv', 'data-id': p.id, style: `width:${v.width}px;height:${v.height}px` },
      h('canvas', { class: 'pc' }), h('canvas', { class: 'wmc' }),
      document.createElementNS('http://www.w3.org/2000/svg', 'svg'),
      h('div', { class: 'fl' }), h('div', { class: 'ol' }), h('span', { class: 'pnum' }, `${i + 1}`));
    pv.querySelector('svg').setAttribute('class', 'mk');
    pv.addEventListener('pointerdown', onPagePointer);
    pagesEl.append(pv);
    io.observe(pv);
    drawOverlay(pv, p); drawForms(pv, p); drawWmLayer(pv, p);
  });
  viewer.scrollTop = ratio * viewer.scrollHeight;
  buildThumbs(); syncChrome();
}

async function renderCanvas(pv) {
  const p = pageById(pv.dataset.id); if (!p) return;
  const dpr = Math.min(devicePixelRatio || 1, 2.5);
  const key = `${S.scale}|${totalRot(p)}|${dpr}`;
  if (pv._key === key) return; pv._key = key;
  const v = vp(p, S.scale * dpr);
  const c = document.createElement('canvas'); c.className = 'pc';
  c.width = Math.floor(v.width); c.height = Math.floor(v.height);
  try {
    pv._task?.cancel();
    pv._task = pageObj(p).render({ canvasContext: c.getContext('2d'), viewport: v, annotationMode: pdfjsLib.AnnotationMode.ENABLE_FORMS });
    await pv._task.promise;
    pv.querySelector('.pc').replaceWith(c);
  } catch (e) { if (e?.name !== 'RenderingCancelledException') console.warn(e); pv._key = null; }
}

function svgEl(tag, attrs) { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
function vRect(v, [x0, y0, x1, y1]) { const r = v.convertToViewportRectangle([x0, y0, x1, y1]); return [Math.min(r[0], r[2]), Math.min(r[1], r[3]), Math.abs(r[2] - r[0]), Math.abs(r[3] - r[1])]; }
function boxPos(v, o) {
  const [x, y] = v.convertToViewportPoint(o.P[0], o.P[1]);
  const [x2, y2] = v.convertToViewportPoint(o.P[0] + o.u[0], o.P[1] + o.u[1]);
  return { x, y, ang: Math.round(Math.atan2(y2 - y, x2 - x) * 180 / Math.PI) };
}
function frameAt(v, x, y) {
  const P = v.convertToPdfPoint(x, y), R = v.convertToPdfPoint(x + 1, y), D = v.convertToPdfPoint(x, y + 1), s = S.scale;
  const r = n => Math.round(n * 1000) / 1000;
  return { P, u: [r((R[0] - P[0]) * s), r((R[1] - P[1]) * s)], d: [r((D[0] - P[0]) * s), r((D[1] - P[1]) * s)] };
}

function drawOverlay(pv, p) {
  const v = vp(p);
  const svg = pv.querySelector('svg.mk');
  svg.setAttribute('viewBox', `0 0 ${v.width} ${v.height}`);
  svg.textContent = '';
  const ol = pv.querySelector('.ol'); ol.textContent = '';
  for (const o of annotsOf(p.id)) {
    const isSel = S.sel && S.sel.id === o.id;
    if (o.type === 'hl') {
      const [x, y, w, hh] = vRect(v, [o.x, o.y, o.x + o.w, o.y + o.h]);
      svg.append(svgEl('rect', { x, y, width: w, height: hh, fill: o.color, 'fill-opacity': .45, style: 'mix-blend-mode:multiply', class: 'hitable', 'data-oid': o.id }));
      if (isSel) svg.append(svgEl('rect', { x: x - 3, y: y - 3, width: w + 6, height: hh + 6, fill: 'none', stroke: 'var(--accent)', 'stroke-dasharray': '4 3', 'stroke-width': 1.5 }));
    } else if (o.type === 'ink') {
      const d = o.pts.map((q, i) => { const [x, y] = v.convertToViewportPoint(q[0], q[1]); return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); }).join('');
      svg.append(svgEl('path', { d, fill: 'none', stroke: o.color, 'stroke-width': o.width * S.scale, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
      svg.append(svgEl('path', { d, fill: 'none', stroke: 'transparent', 'stroke-width': Math.max(14, o.width * S.scale + 10), class: 'hitable', 'data-oid': o.id, style: 'pointer-events:stroke' }));
      if (isSel) { const bb = svg.lastChild.getBBox?.(); }
    } else {
      const { x, y, ang } = boxPos(v, o);
      const st = `left:${x}px;top:${y}px;transform:rotate(${ang}deg)`;
      let e;
      if (o.type === 'text') {
        if (o.cover) { const [cx, cy, cw, ch] = vRect(v, [o.cover[0], o.cover[1], o.cover[0] + o.cover[2], o.cover[1] + o.cover[3]]); svg.prepend(svgEl('rect', { x: cx, y: cy, width: cw, height: ch, fill: o.coverColor || '#ffffff' })); }
        e = h('div', { class: 'obj text', 'data-oid': o.id, style: `${st};font-size:${o.size * S.scale}px;color:${o.color};font-family:${CSSFONT[o.font || 'sans']};font-weight:${o.bold ? 700 : 400}` });
        e.textContent = o.text;
        e.addEventListener('dblclick', () => startEdit(p.id, o.id));
      } else if (o.type === 'img') {
        e = h('div', { class: 'obj img', 'data-oid': o.id, style: `${st};width:${o.w * S.scale}px;height:${o.h * S.scale}px` }, h('img', { src: S.imgs[o.ref], alt: '' }));
        if (isSel) { const rz = h('span', { class: 'rz', 'data-rz': '1' }); e.append(rz); }
      } else if (o.type === 'note') {
        e = h('div', { class: 'obj note', 'data-oid': o.id, style: `left:${x}px;top:${y}px` }, h('div', { class: 'ico', html: icon('note') }));
        if (isSel) {
          const ta = h('textarea', { placeholder: 'Write a comment', 'aria-label': 'Comment text' }); ta.value = o.text;
          let before = null;
          ta.addEventListener('focus', () => before = snap());
          ta.addEventListener('input', () => { o.text = ta.value; });
          ta.addEventListener('change', () => { if (before) pushUndo(before); before = null; });
          ta.addEventListener('pointerdown', ev => ev.stopPropagation());
          e.append(h('div', { class: 'bub' }, ta));
          setTimeout(() => { if (!o.text) ta.focus(); }, 0);
        }
      }
      if (isSel) e.classList.add('sel');
      if (S.editing === o.id) { e.classList.add('editing'); }
      ol.append(e);
    }
  }
  // ink selection box
  const so = findObj(S.sel);
  if (so && so.type === 'ink' && S.sel.pageId === p.id) {
    const xs = so.pts.map(q => q[0]), ys = so.pts.map(q => q[1]);
    const [x, y, w, hh] = vRect(v, [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]);
    svg.append(svgEl('rect', { x: x - 5, y: y - 5, width: w + 10, height: hh + 10, fill: 'none', stroke: 'var(--accent)', 'stroke-dasharray': '4 3', 'stroke-width': 1.5 }));
  }
  // in Edit text mode, outline the lines that can be changed
  if (S.tool === 'edit') {
    const key = lineKey(p);
    if (linesCache.has(key)) for (const ln of linesCache.get(key)) {
      if (annotsOf(p.id).some(o => o.cover && sameLine(o, ln))) continue;
      const [x, y, w, hh] = vRect(v, [ln.x, ln.y - ln.size * 0.25, ln.x + ln.w, ln.y + ln.size * 0.95]);
      svg.append(svgEl('rect', { x: x - 2, y: y - 1, width: w + 4, height: hh + 2, rx: 2, class: 'edhint', fill: 'var(--accent)', 'fill-opacity': .06, stroke: 'var(--accent)', 'stroke-opacity': .45, 'stroke-dasharray': '3 3', 'stroke-width': 1 }));
    }
    else linesOf(p).then(() => { if (S.tool === 'edit') redrawPage(p.id); });
  }
  // search hits
  hits.forEach((hit, i) => {
    if (hit.pageId !== p.id) return;
    const [x, y, w, hh] = vRect(v, hit.rect);
    svg.append(svgEl('rect', { x: x - 1, y: y - 1, width: w + 2, height: hh + 2, rx: 2, fill: 'var(--hit)', 'fill-opacity': i === hitIdx ? .55 : .25, stroke: i === hitIdx ? 'var(--hit)' : 'none', 'stroke-width': 2 }));
  });
}
function redrawPage(id) { const pv = pagesEl.querySelector(`.pv[data-id="${id}"]`); const p = pageById(id); if (pv && p) drawOverlay(pv, p); }
function redrawAll() { pagesEl.querySelectorAll('.pv').forEach(pv => { const p = pageById(pv.dataset.id); if (p) drawOverlay(pv, p); }); }

/* ---------- forms ---------- */
function drawForms(pv, p) {
  const fl = pv.querySelector('.fl'); fl.textContent = '';
  const src = S.sources[p.src]; if (!src.fields.length) return;
  const v = vp(p);
  for (const f of src.fields) for (const w of f.widgets) {
    if (w.page !== p.idx) continue;
    const [x, y, ww, hh] = vRect(v, [w.rect[0], w.rect[1], w.rect[0] + w.rect[2], w.rect[1] + w.rect[3]]);
    const st = `left:${x}px;top:${y}px;width:${ww}px;height:${hh}px;font-size:${Math.max(9, Math.min(hh * (f.multiline ? .32 : .62), 12 * S.scale))}px`;
    let e;
    const setVal = (val, withUndo = true) => { if (withUndo) pushUndo(); S.form[f.key] = val; };
    if (f.kind === 'text') {
      e = h(f.multiline ? 'textarea' : 'input', { class: 'fld', style: st, 'aria-label': f.name, title: f.name });
      e.value = S.form[f.key] ?? '';
      let before = null;
      e.addEventListener('focus', () => before = snap());
      e.addEventListener('input', () => { S.form[f.key] = e.value; syncSameField(f.key, e); });
      e.addEventListener('change', () => { if (before) pushUndo(before); before = null; });
    } else if (f.kind === 'check') {
      e = h('button', { class: 'fld', style: st, 'aria-label': f.name, title: f.name, 'aria-pressed': String(!!S.form[f.key]) });
      e.innerHTML = S.form[f.key] ? icon('check') : '';
      e.addEventListener('click', () => { setVal(!S.form[f.key]); drawForms(pv, p); });
    } else if (f.kind === 'radio') {
      const on = w.on;
      e = h('button', { class: 'fld radio', style: st, 'aria-label': `${f.name}: ${on ?? ''}`, title: on ?? f.name });
      e.textContent = on != null && S.form[f.key] === on ? '●' : '';
      e.addEventListener('click', () => { if (on != null) { setVal(on); redrawForms(); } });
    } else if (f.kind === 'select') {
      e = h('select', { class: 'fld', style: st, 'aria-label': f.name, title: f.name }, h('option', { value: '' }, ''), ...(f.options || []).map(o => h('option', { value: o }, o)));
      e.value = S.form[f.key] ?? '';

/* ---------- watermark ---------- */
function wmCenters(W, H, bw, bh, wm) {
  const cx = W / 2 + (wm.ox || 0) * W, cy = H / 2 + (wm.oy || 0) * H;
  if (!wm.tiled) return [[cx, cy]];
  const stepX = bw + Math.max(50, wm.size * 2.5), stepY = bh + wm.size * 3;
  const a = wm.angle * Math.PI / 180, R = Math.hypot(W, H), out = [];
  const nj = Math.ceil(R / stepY), ni = Math.ceil(R / stepX) + 1;
  for (let j = -nj; j <= nj; j++) {
    const off = (Math.abs(j) % 2) * stepX / 2;
    for (let i = -ni; i <= ni; i++) {
      const lx = i * stepX + off, ly = j * stepY;
      const x = cx + lx * Math.cos(a) - ly * Math.sin(a), y = cy + lx * Math.sin(a) + ly * Math.cos(a);
      if (x > -bw && x < W + bw && y > -bw && y < H + bw) out.push([x, y]);
    }
  }
  return out;
}
function drawWm(ctx, W, H, k, wm) {
  const lines = wm.text.split('\n').filter((l, i, a) => l.trim() || a.length === 1);
  ctx.save();
  ctx.font = `700 ${wm.size * k}px Helvetica, Arial, sans-serif`;
  const bw = Math.max(...lines.map(l => ctx.measureText(l).width / k)), lh = wm.size * 1.25, bh = lh * lines.length;
  ctx.fillStyle = wm.color; ctx.globalAlpha = wm.opacity; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const [x, y] of wmCenters(W, H, bw, bh, wm)) {
    ctx.save(); ctx.translate(x * k, y * k); ctx.rotate(wm.angle * Math.PI / 180);
    lines.forEach((l, i) => ctx.fillText(l, 0, (i - (lines.length - 1) / 2) * lh * k));
    ctx.restore();
  }
  ctx.restore();
}
function drawWmLayer(pv, p) {
  const c = pv.querySelector('.wmc');
  const v = vp(p), dpr = Math.min(devicePixelRatio || 1, 2);
  if (!S.wm) { c.width = c.height = 0; return; }
  c.width = Math.round(v.width * dpr); c.height = Math.round(v.height * dpr);
  drawWm(c.getContext('2d'), v.width / S.scale, v.height / S.scale, S.scale * dpr, S.wm);
}
function redrawWm() { pagesEl.querySelectorAll('.pv').forEach(pv => { const p = pageById(pv.dataset.id); if (p) drawWmLayer(pv, p); }); }

let dl = null;

async function saveFile(filename, data) {
  if (!dl) {
    if (window.claude) { toast('Saving isn’t available in this view. Open the page in a browser to save files.'); return; }
    const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
    const a = h('a', { href: url, download: filename }); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast(`Saved ${filename}`); return;
  }
  try { await dl.save({ filename, data }); toast(`Saved ${filename}`); }
  catch (e) {
    const c = e?.code;
    if (c === 'declined') toast('Save cancelled.');
    else if (c === 'rate_limited') toast('A save is already waiting for you to confirm.');
    else if (c === 'host_unavailable') toast('This app can’t save files here. Open it in a browser or on a computer.');
    else toast('Couldn’t save the file. ' + (e?.message || ''));
  }
}

const textFits = (font, t) => { try { font.encodeText(t); return true; } catch { return false; } };
function textToPng(o) {
  const k = 4, lines = o.text.split('\n'), c = document.createElement('canvas'), x = c.getContext('2d');
  x.font = `${o.bold ? 700 : 400} ${o.size * k}px ${CSSFONT[o.font || 'sans']}`;
  const w = Math.max(...lines.map(l => x.measureText(l).width)) + 2, hh = lines.length * o.size * 1.2 * k;
  c.width = Math.ceil(w); c.height = Math.ceil(hh);
  const y = c.getContext('2d'); y.font = x.font; y.fillStyle = o.color; y.textBaseline = 'alphabetic';
  lines.forEach((l, i) => y.fillText(l, 0, (i * 1.2 + 0.947) * o.size * k));
  return { url: c.toDataURL('image/png'), w: c.width / k, h: c.height / k };
}
const dataUrlBytes = u => Uint8Array.from(atob(u.split(',')[1]), ch => ch.charCodeAt(0));

async function prepSource(si) {
  const src = S.sources[si];
  const doc = await PDFDocument.load(src.bytes, { ignoreEncryption: true, updateMetadata: false });
  if (src.fields.length) {
    const form = doc.getForm();
    for (const f of src.fields) {
      const val = S.form[f.key];
      try {
        const fld = form.getField(f.name);
        if (f.kind === 'text') fld.setText(val || '');
        else if (f.kind === 'check') val ? fld.check() : fld.uncheck();
        else if (f.kind === 'radio') { if (val) fld.select(val); }
        else if (f.kind === 'select') { if (val) fld.select(val); }
      } catch (e) { console.warn('field', f.name, e); }
    }
    try { form.flatten({ updateFieldAppearances: true }); }
    catch (e) { console.warn(e); throw new Error('A form field has characters the standard PDF font can’t show. Try writing it as text on the page instead.'); }
    // flatten can leave links to removed widgets behind; drop them so the file stays valid
    for (const pg of doc.getPages()) {
      const an = pg.node.Annots(); if (!an) continue;
      for (let i = an.size() - 1; i >= 0; i--) { const r = an.get(i); if (r instanceof PDFLib.PDFRef && !doc.context.lookup(r)) an.remove(i); }
    }
  }
  return doc;
}

async function buildVector(pages, withWm) {
  const out = await PDFDocument.create();
  const font = await out.embedFont(StandardFonts.Helvetica), bold = await out.embedFont(StandardFonts.HelveticaBold);
  const fontCache = new Map();
  out._folioFont = async (fam, b) => {
    const name = { sans: b ? 'HelveticaBold' : 'Helvetica', serif: b ? 'TimesRomanBold' : 'TimesRoman', mono: b ? 'CourierBold' : 'Courier' }[fam || 'sans'];
    if (!fontCache.has(name)) fontCache.set(name, name === 'Helvetica' ? font : name === 'HelveticaBold' ? bold : await out.embedFont(StandardFonts[name]));
    return fontCache.get(name);
  };
  const bySrc = new Map();
  pages.forEach(p => { if (!bySrc.has(p.src)) bySrc.set(p.src, []); bySrc.get(p.src).push(p.idx); });
  const copied = new Map();
  for (const [si, idxs] of bySrc) {
    const doc = await prepSource(si);
    const uniq = [...new Set(idxs)], cps = await out.copyPages(doc, uniq);
    uniq.forEach((ix, k) => copied.set(si + ':' + ix, cps[k]));
  }
  const imgCache = new Map();
  for (const p of pages) {
    const cp = copied.get(p.src + ':' + p.idx);
    out.addPage(cp);
    cp.setRotation(degrees(totalRot(p)));
    for (const l of S.ocr[lineKey(p)] || []) {
      try { const sz = Math.max(1, Math.min(l.size * 1.6, l.w / Math.max(1, font.widthOfTextAtSize(l.str, 1)))); cp.drawText(l.str, { x: l.x, y: l.y, size: sz, font, opacity: 0 }); } catch {}
    }
    for (const o of S.annots[p.id] || []) await drawAnnot(out, cp, font, o, imgCache);
    if (withWm && S.wm) drawWmPdf(cp, bold, p);
  }
  out.setProducer('Folio'); out.setCreator('Folio');
  return out.save({ useObjectStreams: false });
}
async function drawAnnot(out, cp, font, o, imgCache) {
  if (o.type === 'hl') cp.drawRectangle({ x: o.x, y: o.y, width: o.w, height: o.h, color: hexRgb(o.color), opacity: 0.45, blendMode: BlendMode.Multiply });
  else if (o.type === 'ink') {
    const path = o.pts.map((q, i) => (i ? 'L' : 'M') + q[0] + ' ' + (-q[1])).join(' ');
    cp.drawSvgPath(path, { x: 0, y: 0, borderColor: hexRgb(o.color), borderWidth: o.width, borderLineCap: LineCapStyle.Round });
  } else if (o.type === 'text' || o.type === 'img') {
    const th = Math.atan2(o.u[1], o.u[0]) * 180 / Math.PI;
    if (o.type === 'text') {
      if (o.cover) cp.drawRectangle({ x: o.cover[0], y: o.cover[1], width: o.cover[2], height: o.cover[3], color: hexRgb(o.coverColor || '#ffffff') });
      font = await out._folioFont(o.font, o.bold);
    }
    if (o.type === 'text' && textFits(font, o.text)) {
      o.text.split('\n').forEach((line, i) => {
        const off = (i * 1.2 + 0.947) * o.size;
        cp.drawText(line, { x: o.P[0] + off * o.d[0], y: o.P[1] + off * o.d[1], size: o.size, font, color: hexRgb(o.color), rotate: degrees(th) });
      });
      return;
    }
    let url, w, hh;
    if (o.type === 'text') ({ url, w, h: hh } = textToPng(o)); else { url = S.imgs[o.ref]; w = o.w; hh = o.h; }
    let im = imgCache.get(url);
    if (!im) { im = url.startsWith('data:image/png') ? await out.embedPng(dataUrlBytes(url)) : await out.embedJpg(dataUrlBytes(url)); imgCache.set(url, im); }
    cp.drawImage(im, { x: o.P[0] + hh * o.d[0], y: o.P[1] + hh * o.d[1], width: w, height: hh, rotate: degrees(th) });
  } else if (o.type === 'note' && o.text.trim()) {
    const ctx = out.context;
    const annot = ctx.obj({ Type: 'Annot', Subtype: 'Text', Rect: [o.P[0], o.P[1] - 20, o.P[0] + 20, o.P[1]], Contents: PDFHexString.fromText(o.text), Name: 'Comment', C: [1, 0.82, 0.25], F: 4, Open: false });
    cp.node.addAnnot(ctx.register(annot));
  }
}
function drawWmPdf(cp, bold, p) {
  const wm = S.wm, v = vp(p, 1), lines = wm.text.split('\n').filter((l, i, a) => l.trim() || a.length === 1);
  if (!lines.every(l => textFits(bold, l))) throw new Error('The watermark has characters the standard PDF font can’t show. Turn on “Make it hard to remove” and save again.');
  const ws = lines.map(l => bold.widthOfTextAtSize(l, wm.size)), bw = Math.max(...ws), lh = wm.size * 1.25, bh = lh * lines.length;
  const th = -wm.angle + totalRot(p), t = th * Math.PI / 180, u = [Math.cos(t), Math.sin(t)], up = [-Math.sin(t), Math.cos(t)];
  for (const [cx, cy] of wmCenters(v.width, v.height, bw, bh, wm)) {
    const C = v.convertToPdfPoint(cx, cy);
    lines.forEach((l, i) => {
      const lx = -ws[i] / 2, ly = ((lines.length - 1) / 2 - i) * lh - 0.35 * wm.size;
      cp.drawText(l, { x: C[0] + lx * u[0] + ly * up[0], y: C[1] + lx * u[1] + ly * up[1], size: wm.size, font: bold, color: hexRgb(wm.color), opacity: wm.opacity, rotate: degrees(th) });
    });
  }
}
async function rasterize(bytes, k = 2.5, onlyFirstAsJpg = false) {
  const doc = await pdfjsLib.getDocument({ data: bytes }).promise;
  const out = onlyFirstAsJpg ? null : await PDFDocument.create();
  for (let i = 1; i <= doc.numPages; i++) {
    const pg = await doc.getPage(i), v = pg.getViewport({ scale: k });
    const c = document.createElement('canvas'); c.width = Math.round(v.width); c.height = Math.round(v.height);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await pg.render({ canvasContext: ctx, viewport: v }).promise;
    if (S.wm) drawWm(ctx, v.width / k, v.height / k, k, S.wm);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.88));
    if (onlyFirstAsJpg) { doc.destroy(); return blob; }
    const im = await out.embedJpg(new Uint8Array(await blob.arrayBuffer()));
    const W = v.width / k, H = v.height / k;
    out.addPage([W, H]).drawImage(im, { x: 0, y: 0, width: W, height: H });
    c.width = c.height = 0;
  }
  doc.destroy();
  out.setProducer('Folio'); out.setCreator('Folio');
  return out.save();
}
async function exportPdf(pages) {
  if (S.wm && S.wm.flatten) return rasterize(await buildVector(pages, false));
  return buildVector(pages, true);
}
const suffix = () => S.wm ? '-watermarked' : '-edited';

}

const saveJpg = () => run('Making the image…', async () => {

};
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo;
$('#bFind').onclick = () => toggleSearch();
$('#bPanel').onclick = () => togglePanel();
$('#bSplit').onclick = openSplitModal;
const zoomTo = s => { S.fit = false; S.scale = Math.max(0.25, Math.min(4, s)); pagesEl.querySelectorAll('.pv').forEach(pv => pv._key = null); rebuild(); };
$('#bZin').onclick = () => zoomTo(S.scale * 1.2);
$('#bZout').onclick = () => zoomTo(S.scale / 1.2);
$('#bFit').onclick = () => { S.fit = true; rebuild(); };
$('#bSave').onclick = e => { e.stopPropagation(); $('#saveMenu').hidden = !$('#saveMenu').hidden; };
$('#mPdf').onclick = () => { $('#saveMenu').hidden = true; savePdf(); };
$('#mJpg').onclick = () => { $('#saveMenu').hidden = true; saveJpg(); };
document.addEventListener('pointerdown', e => { if (!e.target.closest('#saveMenu') && !e.target.closest('#bSave')) $('#saveMenu').hidden = true; });
document.addEventListener('keydown', e => {
  if (document.querySelector('.scrim')) return;
  const typing = e.target.closest('input,textarea,select,[contenteditable="true"],[contenteditable="plaintext-only"]');
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y' && !typing) { e.preventDefault(); redo(); return; }
  if (mod && e.key.toLowerCase() === 'f') { e.preventDefault(); toggleSearch(true); return; }
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); savePdf(); return; }
  if (typing) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel) { e.preventDefault(); deleteSel(); }
  if (e.key === 'Escape') { if (S.tool !== 'select') setTool('select'); else if (S.sel) { const o = S.sel; S.sel = null; redrawPage(o.pageId); syncChrome(); } }
});
let dragDepth = 0;
document.addEventListener('dragenter', e => { if ([...e.dataTransfer.types].includes('Files')) { dragDepth++; $('#app').classList.add('dropping'); } });
document.addEventListener('dragleave', e => { if ([...e.dataTransfer.types].includes('Files') && --dragDepth <= 0) { dragDepth = 0; $('#app').classList.remove('dropping'); } });
document.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
document.addEventListener('drop', e => { if (!e.dataTransfer.files.length) return; e.preventDefault(); dragDepth = 0; $('#app').classList.remove('dropping'); openFiles(e.dataTransfer.files, S.pages.length > 0); });
let rzT; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (S.fit) { const s = fitScale(); if (Math.abs(s - S.scale) > 0.01) rebuild(); } }, 150); });

(async () => {
  if (innerWidth <= 760) $('#work').classList.add('nopanel');
  syncChrome();
  try {
    const bytes = await makeSample();
    const si = await loadSource(bytes, 'sample-form.pdf');
    S.sources[si].pageObjs.forEach((_, i) => S.pages.push({ id: uid(), src: si, idx: i, rot: 0 }));
    // a pre-made highlight on page 2 to show what marks look like
    const p2 = S.pages[1];
    if (p2) S.annots[p2.id] = [{ type: 'hl', id: uid(), x: 54, y: 602, w: 118, h: 16, color: '#FFE14D' }];
  } catch (e) { console.error(e); }
  rebuild();
  // installed app: files opened with "Open with Folio" arrive here
  if ('launchQueue' in window) window.launchQueue.setConsumer(async lp => {
    if (!lp.files || !lp.files.length) return;
    try { openFiles(await Promise.all(lp.files.map(f => f.getFile())), false); } catch (e) { console.error(e); }
  });
})();
})();
</script>

<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
